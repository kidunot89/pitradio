[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# ctypes requires _fields_/_anonymous_ to be real mutable sequences on the class.
"src/pitradio/input/winapi.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app lives in src/ as a package; `vendor/` holds third-party modules that
# are deliberately not dependencies. Both have to be importable however pytest
# is invoked, without installing anything.
pythonpath = ["src", "vendor", "."]
