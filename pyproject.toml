[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# ctypes requires _fields_/_anonymous_ to be real mutable sequences on the class.
"winapi.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is flat modules at the repo root, not an installed package, so the
# root has to be importable however pytest is invoked.
pythonpath = ["."]
