[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# ctypes requires _fields_/_anonymous_ to be real mutable sequences on the class.
"winapi.py" = ["RUF012"]
