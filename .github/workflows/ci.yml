name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - run: ruff check .

      # The suite covers the parts with no Windows or audio dependency: config
      # validation and hot-reload, key-name resolution, text sanitising, path
      # resolution, and the updater's version compare, host allowlist and
      # checksum verification. That it runs on Linux at all is the point — if
      # this job ever fails with an import error, something Windows-only has
      # leaked into a module that is supposed to stay portable.
      - run: pytest -q

      - name: Validate the shipped config
        run: python pitradio.py --check-config

  build:
    name: Windows build smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install nuitka

      # Same suite as the Linux job, on the platform that actually ships.
      - run: pytest -q

      - name: Build with Nuitka
        run: python packaging/build.py

      # The reason this job exists. ctranslate2, onnxruntime and PortAudio ship
      # native libraries that Nuitka's standalone mode does not always collect,
      # and the failure only shows up when the built binary actually imports
      # them. Running the real exe here catches that in CI instead of on
      # someone's rig after they've installed it.
      - name: Run the built binary
        run: |
          .\build\pitradio.dist\pitradio.exe --check-config
          if ($LASTEXITCODE -ne 0) { throw "built binary failed --check-config" }

      - name: Verify the native dependencies actually import
        run: |
          .\build\pitradio.dist\pitradio.exe --list-devices
          if ($LASTEXITCODE -ne 0) { throw "audio stack did not load in the built binary" }

      - uses: actions/upload-artifact@v4
        with:
          name: pitradio-dist
          path: build/pitradio.dist/
          retention-days: 7
