name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A 40-minute Windows build for a commit that has already been superseded is
# pure waste. Newer pushes to the same ref cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: pip install -r requirements-dev.txt

      - run: ruff check .

      # The suite covers the parts with no Windows or audio dependency: config
      # validation and hot-reload, key-name resolution, text sanitising, path
      # resolution, and the updater's version compare, host allowlist and
      # checksum verification. That it runs on Linux at all is the point — if
      # this job ever fails with an import error, something Windows-only has
      # leaked into a module that is supposed to stay portable.
      - run: pytest -q

      - name: Validate the shipped config
        run: python pitradio.py --check-config

  build:
    name: Windows build smoke test
    # Don't spend 40 minutes compiling for a commit whose tests already fail.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install nuitka

      # Same suite as the Linux job, on the platform that actually ships.
      - run: pytest -q

      # restore + save as separate steps, deliberately. actions/cache only
      # writes its cache when the job SUCCEEDS, and a build that fails has
      # still compiled most of the dependency tree — which is precisely the
      # expensive part worth keeping. Every failed run was throwing that away
      # and starting the next one cold, which is why builds sat at ~40 minutes
      # instead of ~13.
      #
      # The key covers the dependency set only. packaging/build.py used to be
      # in it, but it changes constantly and Nuitka's cache is content-addressed
      # internally, so a coarse key hits far more often and stale entries are
      # harmless.
      # SDL3 has no Python package that ships a Windows binary, so the DLL
      # comes from the official libsdl-org release, verified against a
      # pinned hash. Without it the build falls back to SDL2 and loses the
      # devices SDL3 was added for.
      - name: Fetch SDL3
        run: python packaging/fetch_sdl3.py

      - name: Restore the Nuitka compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}
          restore-keys: nuitka-${{ runner.os }}-py312-

      - name: Build with Nuitka
        run: python packaging/build.py

      # success() || failure(), NOT always(): a *failed* build has still
      # compiled most of the dependency tree and is worth keeping, but a
      # *cancelled* one may have compiled almost nothing — and always() saves
      # that stunted cache too. Since the restore step falls back to the
      # newest entry matching the prefix, one cancelled run then becomes what
      # every later build inherits. That is measurable: successful runs saved
      # 80MB and the next build got 1272 clcache hits out of 1277; cancelled
      # runs saved 44-46MB and the next build got 0.
      #
      # Superseding a tag cancels its release run, which happens constantly
      # here, so this was poisoning the cache more often than not.
      - name: Save the Nuitka compilation cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}

      # The reason this job exists. ctranslate2, onnxruntime, PyAV and PortAudio
      # ship native libraries that Nuitka's standalone mode does not always
      # collect, and the failure only shows up when the built binary actually
      # imports them. Running the real exe here catches that in CI instead of on
      # someone's rig after they've installed it.
      #
      # Start-Process rather than invoking the exe directly: --windows-console-
      # mode=attach produces a GUI-subsystem binary, and PowerShell neither
      # waits for those nor sets $LASTEXITCODE from them, so a direct call would
      # test a stale exit code rather than this process's.
      - name: Run the built binary
        run: |
          $p = Start-Process -FilePath .\build\pitradio.dist\pitradio.exe `
                 -ArgumentList '--check-config' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "built binary failed --check-config (exit $($p.ExitCode))" }

      - name: Verify the native dependencies actually import
        run: |
          $p = Start-Process -FilePath .\build\pitradio.dist\pitradio.exe `
                 -ArgumentList '--list-devices' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "audio stack did not load (exit $($p.ExitCode))" }

      # --check-config and --list-devices both return before importing tkinter,
      # the hook or the speech stack, so a build can pass both and still be
      # unable to transcribe. v0.1.0 shipped that way, missing av.utils. This
      # loads every component and opens a real Tk window.
      - name: Load every component in the built binary
        run: |
          $p = Start-Process -FilePath .\build\pitradio.dist\pitradio.exe `
                 -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      # The condition that actually broke every shortcut launch through 0.1.2.
      # Dropping -NoNewWindow means the GUI-subsystem binary gets no console, so
      # its standard handles are invalid — exactly what happens from the Start
      # Menu, and nothing like running it from a terminal. Any subprocess call
      # that fails to redirect all three streams dies here and nowhere else.
      - name: Load every component with NO console attached
        run: |
          $p = Start-Process -FilePath .\build\pitradio.dist\pitradio.exe `
                 -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "--- app log ---"
            Get-Content "$env:LOCALAPPDATA\pitradio\logs\pitradio.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "self-test failed with no console (exit $($p.ExitCode)); this is the shortcut-launch path"
          }

      # Everything above ran out of build\pitradio.dist. That is not what users
      # receive, and until v0.1.1 nothing had ever executed the installer or the
      # files it lays down — which is how a broken post-install launch shipped.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        run: |
          $v = python packaging/build.py --version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v packaging\pitradio.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed to compile" }

      - name: Install it for real
        run: |
          $setup = Get-ChildItem packaging\Output\pitradio-setup-*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName `
                 -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' `
                 -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed (exit $($p.ExitCode))" }

      - name: Verify the installed application
        run: |
          $dir = "C:\Program Files\PitRadio"
          $exe = "$dir\pitradio.exe"
          if (-not (Test-Path $exe)) { throw "$exe missing after install" }

          # updater.installed_via_installer() keys off this file. Without it the
          # self-updater silently refuses to update anyone.
          if (-not (Get-ChildItem "$dir\unins*.exe" -ErrorAction SilentlyContinue)) {
            throw "no uninstaller present; the self-updater would refuse to run"
          }

          # Running from Program Files is the case that matters: a different
          # directory, and one the app must never try to write into.
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed binary failed --self-test" }

          # Again with no console, which is how a Start Menu shortcut runs it.
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "--- app log ---"
            Get-Content "$env:LOCALAPPDATA\pitradio\logs\pitradio.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "installed binary failed --self-test with no console; shortcut launches would die"
          }

          $p = Start-Process -FilePath $exe -ArgumentList '--check-config' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed binary failed --check-config" }

          if (-not (Test-Path "$env:APPDATA\pitradio\config.json")) {
            throw "config was not seeded into %APPDATA%; hot-reload would be broken"
          }

      - name: Uninstall and verify it leaves user data alone
        run: |
          $dir = "C:\Program Files\PitRadio"
          $unins = (Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1).FullName
          Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/NORESTART' -Wait

          # Inno's uninstaller copies itself to temp and relaunches, so -Wait can
          # return before the removal has actually finished.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\pitradio.exe"); $i++) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path "$dir\pitradio.exe") { throw "uninstall left the executable behind" }

          # Config, logs and a 250MB cached model are the user's. An
          # uninstall/reinstall cycle must not cost them any of it.
          if (-not (Test-Path "$env:APPDATA\pitradio\config.json")) {
            throw "uninstall deleted the user's config"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: pitradio-installer
          path: packaging/Output/pitradio-setup-*.exe
          retention-days: 7
