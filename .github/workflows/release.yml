name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history and tags: the changelog step diffs against the
          # previous tag, and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka

      # Shares the cache the CI workflow populates, so a release build usually
      # starts warm rather than recompiling the whole dependency tree.
      - name: Cache the Nuitka compilation cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'packaging/build.py') }}
          restore-keys: nuitka-${{ runner.os }}-py312-

      - name: Read version
        id: version
        run: |
          $v = python packaging/build.py --version
          echo "value=$v" >> $env:GITHUB_OUTPUT
          echo "Building version $v"

      # The tag and __version__ must agree, or the self-updater will keep
      # offering an update that installs the same version it already has.
      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = "${{ steps.version.outputs.value }}"
          if ($tag -ne $ver) {
            throw "tag $tag does not match __version__ $ver in pitradio.py"
          }

      - name: Build with Nuitka
        run: python packaging/build.py

      # Start-Process because the binary is GUI-subsystem: PowerShell does not
      # wait for those, and $LASTEXITCODE would be a stale value from an earlier
      # command rather than this one's result.
      - name: Smoke test the binary
        run: |
          $p = Start-Process -FilePath .\build\pitradio.dist\pitradio.exe `
                 -ArgumentList '--check-config' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "built binary failed --check-config (exit $($p.ExitCode))" }

      # Gates the release on every component actually loading. Without this,
      # v0.1.0 published a build that could not transcribe at all.
      - name: Load every component before publishing
        run: |
          $p = Start-Process -FilePath .\build\pitradio.dist\pitradio.exe `
                 -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test failed; refusing to publish (exit $($p.ExitCode))" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.value }} `
            packaging\pitradio.iss

      - name: Package the portable build
        run: |
          Compress-Archive -Path build\pitradio.dist\* `
            -DestinationPath packaging\Output\pitradio-portable-${{ steps.version.outputs.value }}.zip

      # The self-updater refuses to run anything whose hash is not listed here,
      # so this file is not optional — a release without it cannot be installed
      # automatically. Python rather than a shell pipeline because the format
      # has to match what the updater parses, and that agreement is covered by
      # tests/test_checksums.py.
      - name: Generate SHA256SUMS
        run: python packaging/checksums.py packaging/Output

      # Written as a file rather than an inline body so the changelog can be
      # assembled from git history. bash rather than pwsh: the quoting for a
      # multi-line document with interpolation is far less error-prone.
      - name: Assemble the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # The most recent tag that isn't this one. Sorted by version rather
          # than date so an out-of-order or backfilled tag doesn't win.
          PREV=$(git tag --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)

          {
            echo "Install with \`pitradio-setup-${VERSION}.exe\`."
            echo

            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              RANGE="${PREV}..${TAG}"
            else
              echo "## Changes"
              RANGE="$TAG"
            fi
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo
            echo

            if [ -n "$PREV" ]; then
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
              echo
            fi

            cat <<'NOTES'
          ## Before you install

          Windows will show a SmartScreen warning: these builds are not
          code-signed, so Windows has no publisher to attribute them to. Choose
          **More info → Run anyway**. Some antivirus products flag it too — the
          app installs a global keyboard hook and synthesises keystrokes, which
          is a keylogger's behavioural signature and also exactly what
          push-to-talk dictation requires.

          Everything runs locally. The only network access is the one-time
          speech model download and the update check. Verify your download
          against `SHA256SUMS` if you'd rather not take that on trust.

          PitRadio needs to run as administrator: if a sim runs elevated and
          PitRadio doesn't, Windows silently discards every keystroke it sends.
          The installer sets this up for you.
          NOTES
          } > release_notes.md

          echo "--- release notes ---"
          cat release_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            packaging/Output/pitradio-setup-*.exe
            packaging/Output/pitradio-portable-*.zip
            packaging/Output/SHA256SUMS
          body_path: release_notes.md
